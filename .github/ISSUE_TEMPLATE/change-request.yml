name: Change request
description: Propose a change in plain English
labels: ["ai-change"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which area is this about?
      options:
        - Web app (React)
        - API (.NET)
        - WordPress site
        - Salesforce
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: Describe it in your own words. No technical detail needed.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does this matter (business value)?
