name: Claude change request to PR
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    if: github.event.label.name == 'ai-change'
    runs-on: ubuntu-latest
    environment: ai-change   # configure required reviewers here as a gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Implement on a branch and open a PR
        env:
          # Either credential works; the CLI uses whichever is set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"
          claude -p "Run /propose-change using the body of GitHub issue #$ISSUE_NUMBER (read it with gh issue view). Open a PR that links the issue. Do not merge or deploy." \
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(npm install:*),Bash(npm test:*),Bash(npm run build:*),Bash(npx vitest:*),Bash(php:*)" \
            --max-turns 30
