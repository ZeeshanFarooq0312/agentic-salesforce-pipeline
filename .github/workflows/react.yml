name: React web
on:
  pull_request:
    paths: ["apps/react-web/**"]
  push:
    branches: [main]
    paths: ["apps/react-web/**"]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/react-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
