name: .NET API
on:
  pull_request:
    paths: ["apps/dotnet-api/**"]
  push:
    branches: [main]
    paths: ["apps/dotnet-api/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test apps/dotnet-api/tests/Api.Tests --configuration Release

  deploy-staging:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet publish apps/dotnet-api/src/Api -c Release -o out
      - run: cd out && zip -r ../api.zip .
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to staging slot only
        run: az webapp deploy --name ${{ vars.AZURE_WEBAPP_NAME }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --slot staging --src-path api.zip --type zip
