name: WordPress plugin
on:
  pull_request:
    paths: ["apps/wordpress-plugin/**"]
  push:
    branches: [main]
    paths: ["apps/wordpress-plugin/**"]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2" }
      - name: Lint
        run: find apps/wordpress-plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit test
        run: php apps/wordpress-plugin/tests/rating-test.php
